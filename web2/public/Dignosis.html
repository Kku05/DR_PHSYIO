<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiotherapy Diagnosis</title>
    <style>
        .diagnosis-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .diagnosis-option {
            margin-bottom: 20px;
        }
        .content-display {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .video-section, .image-section {
            flex: 1;
        }
        .text-section {
            flex: 2;
            padding: 20px;
            background: #f5f5f5;
        }
        video, img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="diagnosis-container">
        <h1>Physiotherapy Diagnosis</h1>
        
        <div class="diagnosis-option">
            <select id="diagnosisSelect" onchange="updateContent()">
                <option value="">Select Diagnosis</option>
                <option value="backPain">Back Pain</option>
                <option value="neckPain">Neck Pain</option>
                <option value="kneePain">Knee Pain</option>
                <option value="shoulderPain">Shoulder Pain</option>
            </select>
        </div>

        <div class="content-display">
            <div class="video-section">
                <h2>Exercise Video</h2>
                <video id="diagnosisVideo" controls>
                    <source src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="image-section">
                <h2>Reference Image</h2>
                <img id="diagnosisImage" src="" alt="Diagnosis reference">
            </div>

            <div class="text-section">
                <h2>Treatment Information</h2>
                <div id="diagnosisText"></div>
            </div>
        </div>
    </div>

    <script>
        function updateContent() {
            const select = document.getElementById('diagnosisSelect');
            const video = document.getElementById('diagnosisVideo');
            const image = document.getElementById('diagnosisImage');
            const text = document.getElementById('diagnosisText');

            const diagnosis = select.value;
            const contentMap = {
                backPain: {
                    video: "/videos/back-exercise.mp4",
                    image: "/images/back-anatomy.jpg",
                    text: "Back pain treatment includes specific exercises and stretches..."
                },
                neckPain: {
                    video: "/videos/neck-exercise.mp4",
                    image: "/images/neck-anatomy.jpg",
                    text: "Neck pain can be treated with gentle stretching and strengthening..."
                },
                // Add more conditions as needed
            };

            if (diagnosis && contentMap[diagnosis]) {
                video.src = contentMap[diagnosis].video;
                image.src = contentMap[diagnosis].image;
                text.textContent = contentMap[diagnosis].text;
            } else {
                video.src = "";
                image.src = "";
                text.textContent = "Please select a diagnosis option";
            }
        }
    </script>
</body>
</html>

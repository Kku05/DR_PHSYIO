<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Physio/feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .feedback-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background: white;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-family: "Lora", serif;
        }
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: "Lora", serif;
        }
        .form-group textarea {
            height: 150px;
            resize: vertical;
        }
        button {
            background-color: #5b07d0;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Lora", serif;
        }
        button:hover {
            background-color: #4a05a8;
        }
        nav {
            background-color: #5b07d0;
            padding: 1rem;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav ul {
            display: none;
            flex-direction: column;
            align-items: center;
            list-style: none;
            padding: 0;
            margin: 0;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #5b07d0;
        }
        nav ul li {
            margin-bottom: 10px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            display: block;
            padding: 10px;
        }
        nav ul li a:hover {
            background-color: #4a05a8;
            border-radius: 4px;
        }
        .menu-toggle {
            display: block;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
            text-align: center;
        }
        @media (min-width: 769px) {
            nav ul {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DR.PHYSIO</div>
        <div class="menu-toggle">☰ Menu</div>
        <ul>
            <li><a href="front.html">Home</a></li>
            <li><a href="index.html">Room</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <div class="feedback-container">
        <h2>Provide Your Feedback</h2>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="feedback">Your Feedback:</label>
                <textarea id="feedback" required></textarea>
            </div>
            <button type="submit">Send Feedback</button>
        </form>
    </div>

    <script>
        document.querySelector('.menu-toggle').addEventListener('click', function() {
            const navUl = document.querySelector('nav ul');
            navUl.style.display = navUl.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const feedback = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                feedback: document.getElementById('feedback').value
            };

            try {
                const response = await fetch('/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(feedback)
                });

                if (response.ok) {
                    alert('Thank you for your feedback!');
                    this.reset();
                } else {
                    alert('Failed to submit feedback. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            }
        });
    </script>
</body>
</html>

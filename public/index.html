<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Physio/Room</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
        }
        nav {
            background-color: #5b07d0;
            padding: 1rem;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav ul {
            display: none;
            flex-direction: column;
            align-items: center;
            list-style: none;
            padding: 0;
            margin: 0;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #5b07d0;
        }
        nav ul li {
            margin-bottom: 10px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            display: block;
            padding: 10px;
        }
        nav ul li a:hover {
            background-color: #4a05a8;
            border-radius: 4px;
        }
        .menu-toggle {
            display: block;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
            text-align: center;
        }
        @media (min-width: 769px) {
            nav ul {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DR.PHYSIO</div>
        <div class="menu-toggle">☰ Menu</div>
        <ul>
            <li><a href="front.html">Home</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="feedback.html">Feedback</a></li>
        </ul>
    </nav>
    <h1>Room</h1>
    <ul>
        <li>
            <div class="room-entry">
                <input type="text" placeholder="Enter OTP" id="otp1">
                <button onclick="verifyOTP('web1', document.getElementById('otp1').value)">Verify & Enter Room 1</button>
            </div>
        </li>
        <li>
            <div class="room-entry">
                <input type="text" placeholder="Enter OTP" id="otp2">
                <button onclick="verifyOTP('web2', document.getElementById('otp2').value)">Verify & Enter Room 2</button>
            </div>
        </li>
    </ul>

    <script>
        document.querySelector('.menu-toggle').addEventListener('click', function() {
            const navUl = document.querySelector('nav ul');
            navUl.style.display = navUl.style.display === 'flex' ? 'none' : 'flex';
        });

        function verifyOTP(room, otp) {
            fetch('/verify-otp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ room, otp })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = `/${room}`;
                } else {
                    alert('Invalid OTP. Please try again.');
                }
            });
        }

        document.getElementById('otp1').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyOTP('web1', this.value);
            }
        });
        document.getElementById('otp2').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyOTP('web2', this.value);
            }
        });
    </script>
</body>
</html>

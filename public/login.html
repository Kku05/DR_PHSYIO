<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Physio/LOGIN</title>
    <style>
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #5b07d0;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .toggle-form {
            text-align: center;
            margin-top: 15px;
        }
        nav {
            background-color: #5b07d0;
            padding: 1rem;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav ul {
            display: none;
            flex-direction: column;
            align-items: center;
            list-style: none;
            padding: 0;
            margin: 0;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #5b07d0;
        }
        nav ul li {
            margin-bottom: 10px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            display: block;
            padding: 10px;
        }
        nav ul li a:hover {
            background-color: #4a05a8;
            border-radius: 4px;
        }
        .menu-toggle {
            display: block;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
            text-align: center;
        }
        @media (min-width: 769px) {
            nav ul {
                display: none;
            }
        }
        #userProfile {
            margin-top: 20px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }
        #userProfile span {
            display: block;
            margin-bottom: 10px;
        }
        #userProfile button {
            margin: 5px;
            width: auto;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DR.PHYSIO</div>
        <div class="menu-toggle">☰ Menu</div>
        <ul>
            <li><a href="front.html">Home</a></li>
            <li><a href="index.html">Room</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="feedback.html">Feedback</a></li>
        </ul>
    </nav>
    <div class="container">
        <div id="loginForm">
            <h2>Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div class="toggle-form">
                <p>Don't have an account? <a href="#" onclick="toggleForms()">Sign Up</a></p>
            </div>
        </div>

        <div id="signupForm" style="display: none;">
            <h2>Sign Up</h2>
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <input type="text" id="signupName" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signupEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signupPassword" placeholder="Password" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <div class="toggle-form">
                <p>Already have an account? <a href="#" onclick="toggleForms()">Login</a></p>
            </div>
        </div>
        <div id="userProfile" style="display: none;">
            <span id="userName"></span>
            <span id="userEmail"></span>
            <button id="changePassword">Change Password</button>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <script>
        document.querySelector('.menu-toggle').addEventListener('click', function() {
            const navUl = document.querySelector('nav ul');
            navUl.style.display = navUl.style.display === 'flex' ? 'none' : 'flex';
        });

        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            signupForm.style.display = signupForm.style.display === 'none' ? 'block' : 'none';
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/front.html';
                } else {
                    alert('Invalid credentials');
                }
            })
            .catch(error => {
                alert('Login failed. Please try again.');
            });
        }

        function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Signup successful! Please login.');
                    toggleForms();
                } else {
                    alert('Signup failed. Please try again.');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('userProfile').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('userName').textContent = `Name: ${user.name}`;
                document.getElementById('userEmail').textContent = `Email: ${user.email}`;
            }
        });

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('sessionId');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        });

        document.getElementById('changePassword').addEventListener('click', async () => {
            const user = JSON.parse(localStorage.getItem('user'));
            const currentPassword = prompt("Enter current password");
            const newPassword = prompt("Enter new password");
            
            if (!currentPassword || !newPassword) return;
            
            try {
                const response = await fetch('/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: user.email,
                        currentPassword,
                        newPassword
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('Password updated successfully');
                } else {
                    alert('Failed to update password');
                }
            } catch (error) {
                alert('Error updating password');
            }
        });

        if (localStorage.getItem('user')) {
            document.getElementById('userProfile').style.display = 'block';
            document.getElementById('loginForm').style.display = 'none';
        }
    </script>
</body>
</html>
